services:
  afm:
    build:
      context: .
    image: afm-analysis-platform-noshap:latest
    container_name: afm-analysis-noshap
    ports:
      # host:container - this no-SHAP copy uses 3010 so it can run next to the
      # retrain copy (3009), SHAP copy (3008), compact copy (3007) and the older
      # ones (3000-3006); open http://localhost:3010
      - "3010:3000"
    volumes:
      # Keep uploads and generated reports on your computer, so they survive
      # the container being stopped or rebuilt.
      - ./uploads:/app/uploads
      - ./results:/app/results
    restart: unless-stopped
